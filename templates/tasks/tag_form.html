{% extends "base.html" %}

{% block content %}
<h1 class="fw-bold mb-4">{% if object %}Update tag{% else %}Create tag{% endif %}</h1>

<form method="post" novalidate style="max-width: 500px;">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <div class="mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label fw-semibold">Tag name</label>
        {{ form.name }}
        {% if form.name.errors %}
            <div class="text-danger small mt-1">{{ form.name.errors }}</div>
        {% endif %}
    </div>

    <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary px-4">{% if object %}Update{% else %}Create{% endif %}</button>
        <a href="{% url 'tasks:tag-list' %}" class="btn btn-secondary px-4">Cancel</a>
    </div>
</form>
{% endblock %}
