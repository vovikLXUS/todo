{% extends "base.html" %}

{% block content %}
<h1 class="fw-bold mb-4">Delete task</h1>

<p class="fs-5">Are you sure you want to delete the task: <strong>"{{ object.content }}"</strong>?</p>

<form method="post" style="max-width: 500px;">
    {% csrf_token %}
    <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-danger px-4">Delete</button>
        <a href="{% url 'tasks:index' %}" class="btn btn-secondary px-4">Cancel</a>
    </div>
</form>
{% endblock %}
