{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold m-0">Tag list</h1>
    <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary px-3 py-2">Add tag</a>
</div>

{% if tag_list %}
<div class="table-responsive">
    <table class="table table-hover align-middle">
        <thead>
            <tr>
                <th scope="col" style="width: 60px;">Name</th>
                <th scope="col" style="width: 60px;">Update</th>
                <th scope="col" style="width: 60px;">Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for tag in tag_list %}
            <tr>
                <td>{{ tag.name }}</td>
                <td>
                    <a href="{% url 'tasks:tag-update' tag.id %}" class="btn btn-secondary">Update</a>
                </td>
                <td>
                    <a href="{% url 'tasks:tag-delete' tag.id %}" class="btn btn-secondary">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="text-muted">No tags available.</p>
{% endif %}

{% endblock %}
